<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <title>鉄道ダイヤグラム</title>
  <style>
    :root {
      --bg-top: #081120;
      --bg-bottom: #132542;
      --panel-line: rgba(117, 144, 184, 0.25);
      --accent: #8cc9ff;
      --accent-strong: #38bdf8;
      --text-main: #ecf0f1;
      --text-sub: #9fb8d6;
      --diagram-bg: #0a1424;
      --sidebar-w: 118px;
      --time-h: 52px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text-main);
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    #workspace {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--time-h) 1fr;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    #corner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      padding: 8px 10px;
      background: linear-gradient(180deg, rgba(7,17,33,0.96), rgba(13,26,46,0.9));
      border-right: 1px solid var(--panel-line);
      border-bottom: 1px solid var(--panel-line);
    }

    #corner .line-small { color: var(--text-sub); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
    #corner .line-small.date { color: var(--accent); letter-spacing: 0.02em; font-weight: 700; }
    #corner .line-name  { color: var(--text-main); font-size: 11px; font-weight: 800; line-height: 1.2; }

    #time-header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(7,17,33,0.96), rgba(13,26,46,0.9));
      border-bottom: 1px solid var(--panel-line);
    }

    #station-sidebar {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(7,17,33,0.96), rgba(13,26,46,0.9));
      border-right: 1px solid var(--panel-line);
    }

    #diagram-area {
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: var(--diagram-bg);
      touch-action: none;
    }
    #diagram-area:active { cursor: grabbing; }

    canvas { position: absolute; inset: 0; }

    /* ===== UI PANEL ===== */
    #ui-toggle {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      right: max(14px, env(safe-area-inset-right));
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(140,201,255,0.3);
      background: rgba(7,17,33,0.88);
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: background 0.2s;
    }
    #ui-toggle:hover { background: rgba(20,40,70,0.95); }

    #ui-panel {
      position: fixed;
      bottom: max(66px, calc(env(safe-area-inset-bottom) + 52px));
      right: max(14px, env(safe-area-inset-right));
      z-index: 40;
      width: min(340px, calc(100vw - 28px));
      border: 1px solid var(--panel-line);
      border-radius: 16px;
      background: rgba(7,17,33,0.93);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* 横向きなど画面が低い時はパネル内をスクロール（画面外にはみ出さない） */
      max-height: calc(100dvh - max(66px, calc(env(safe-area-inset-bottom) + 52px)) - max(8px, env(safe-area-inset-top)));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transition: opacity 0.2s, transform 0.2s;
    }
    #ui-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .panel-section-title {
      color: var(--text-sub);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Route group tabs */
    #route-group-tabs {
      display: flex;
      gap: 6px;
    }
    .group-tab {
      flex: 1;
      padding: 7px 4px;
      border-radius: 10px;
      border: 1px solid rgba(140,201,255,0.18);
      background: rgba(140,201,255,0.07);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, color 0.15s;
    }
    .group-tab.active {
      background: rgba(140,201,255,0.22);
      border-color: rgba(140,201,255,0.4);
      color: var(--accent);
    }

    /* 運転日プルダウン（切替タブと同じ行。新幹線タブ選択時のみ表示） */
    #date-select {
      flex: 0 1 auto;
      min-width: 0;
      /* iOS Safari はフォーカス時に 16px 未満だと自動ズームするため 16px にする */
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      color: var(--accent);
      /* iOS 標準の白い見た目を外し、パネルの配色に合わせる（右端に ▼ を描く） */
      -webkit-appearance: none;
      appearance: none;
      background-color: rgba(140,201,255,0.12);
      background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%),
                        linear-gradient(135deg, var(--accent) 50%, transparent 50%);
      background-position: right 12px center, right 7px center;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      border: 1px solid rgba(140,201,255,0.35);
      border-radius: 10px;
      padding: 3px 22px 3px 8px;
    }
    #date-select option { color: #000; }
    #date-select.hidden { display: none; }
    #date-select:disabled { opacity: 0.5; }

    #legend-note {
      margin-top: 6px;
      color: var(--text-sub);
      font-size: 10px;
      line-height: 1.5;
    }
    #legend-note:empty { display: none; }

    #lock-btn {
      align-self: flex-end;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 10px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    #lock-btn.hidden { display: none; }

    /* パスワード入力（暗号化データのとき） */
    #unlock-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; text-align: left; }
    #unlock-form.hidden, .spinner.hidden { display: none; }
    #unlock-user { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #unlock-pass {
      font-size: 16px;   /* iOS のフォーカス時ズーム防止 */
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(140,201,255,0.35);
      background: rgba(140,201,255,0.08);
      color: var(--text-main);
    }
    .unlock-remember { color: var(--text-sub); font-size: 13px; display: flex; align-items: center; gap: 6px; }
    #unlock-btn {
      font-size: 16px;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(140,201,255,0.4);
      background: rgba(140,201,255,0.22);
      color: var(--accent);
    }
    #unlock-btn:disabled { opacity: 0.6; }
    #unlock-error { color: #ff8a8a; font-size: 13px; min-height: 1em; }

    /* Route list */
    #route-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    #route-list::-webkit-scrollbar { width: 4px; }
    #route-list::-webkit-scrollbar-track { background: transparent; }
    #route-list::-webkit-scrollbar-thumb { background: rgba(140,201,255,0.2); border-radius: 2px; }

    .route-item {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(140,201,255,0.1);
      background: rgba(140,201,255,0.05);
      color: var(--text-sub);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .route-item:hover { background: rgba(140,201,255,0.12); color: var(--text-main); }
    .route-item.active {
      background: rgba(140,201,255,0.18);
      border-color: rgba(140,201,255,0.35);
      color: var(--accent);
    }
    .route-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* Legend */
    #legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
    }
    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-sub);
      font-size: 11px;
    }
    .legend-line {
      width: 22px;
      height: 3px;
      border-radius: 2px;
      flex: 0 0 auto;
    }
    .legend-line.thick { height: 5px; }

    /* Loading */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5,11,21,0.92);
      backdrop-filter: blur(20px);
      transition: opacity 0.32s ease, visibility 0.32s ease;
    }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-card {
      width: min(420px, calc(100vw - 36px));
      padding: 28px 26px;
      border: 1px solid rgba(140,201,255,0.16);
      border-radius: 24px;
      background: rgba(8,16,30,0.9);
      text-align: center;
    }
    .spinner {
      width: 48px; height: 48px;
      margin: 0 auto 18px;
      border: 3px solid rgba(140,201,255,0.18);
      border-top-color: var(--accent-strong);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-title { color: var(--text-main); font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .loading-detail { color: var(--text-sub); font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

</head>
<body>

<div id="loading">
  <div class="loading-card">
    <div class="spinner" id="loading-spinner"></div>
    <div class="loading-title" id="loading-title">ダイヤデータを準備中</div>
    <div class="loading-detail" id="loading-detail">データを確認しています...</div>
    <!-- 公開 Pages（暗号化データ）用のパスワード入力。iPhone のパスワード自動入力（Face ID）に対応 -->
    <form id="unlock-form" class="hidden" autocomplete="on">
      <input type="text" id="unlock-user" name="username" autocomplete="username" value="train-diagram" tabindex="-1" aria-hidden="true">
      <input type="password" id="unlock-pass" name="password" autocomplete="current-password" placeholder="パスワード" required>
      <label class="unlock-remember"><input type="checkbox" id="unlock-remember" checked> この端末で記憶する</label>
      <button type="submit" id="unlock-btn">開く</button>
      <div id="unlock-error" role="alert"></div>
    </form>
  </div>
</div>

<div id="workspace">
  <div id="corner">
    <div class="line-small" id="line-date-display">Line View</div>
    <div class="line-name" id="line-name-display">---</div>
  </div>
  <div id="time-header"><canvas id="time-canvas"></canvas></div>
  <div id="station-sidebar"><canvas id="station-canvas"></canvas></div>
  <div id="diagram-area"><canvas id="diagram-canvas"></canvas></div>
</div>

<!-- UI toggle button -->
<button id="ui-toggle" aria-label="路線・凡例">☰</button>

<!-- UI panel -->
<div id="ui-panel" class="hidden">
  <div>
    <div class="panel-section-title">路線グループ</div>
    <div id="route-group-tabs">
      <button class="group-tab active" data-group="shinkansen">新幹線</button>
      <button class="group-tab" data-group="zairaisen">在来線</button>
      <select id="date-select" aria-label="新幹線の運転日"></select>
    </div>
  </div>
  <div>
    <div class="panel-section-title">路線選択</div>
    <div id="route-list"></div>
  </div>
  <div>
    <div class="panel-section-title">凡例</div>
    <div id="legend-items"></div>
    <div id="legend-note"></div>
  </div>
  <button type="button" id="lock-btn" class="hidden">この端末の鍵を消してロック</button>
</div>

<script>
// ============================================================
// 定数・設定
// ============================================================
const FONT = "'Avenir Next','Hiragino Sans','Yu Gothic',sans-serif";
const PX_PER_MIN     = 2.8;
const PX_PER_KM_SHIN = 2.15;  // 新幹線: 1kmあたりのピクセル数
const PX_PER_KM_ZAI  = 8.0;   // 在来線: 1kmあたりのピクセル数（10_diagramと同一）
const TIME_H         = 52;

// 新幹線列車種別
const SHINKANSEN_META = {
  nozomi:  { label: "のぞみ",  color: "#FFD700" },
  hikari:  { label: "ひかり",  color: "#FF6B6B" },
  kodama:  { label: "こだま",  color: "#5BB8FF" },
  mizuho:  { label: "みずほ",  color: "#FF9040" },
  sakura:  { label: "さくら",  color: "#FF85C0" },
  tsubame: { label: "つばめ",  color: "#D580FF" },
};

// 在来線列車種別（紺背景用の明るい色）
const ZAIRAISEN_META = {
  local:         { label: "普通",       color: "#FFFFFF",  thick: false },
  rapid_local:   { label: "区間快速",   color: "#4CAF50",  thick: false },
  rapid:         { label: "快速",       color: "#5BB8FF",  thick: false },
  rapid_new:     { label: "新快速",     color: "#FF9040",  thick: false },
  rapid_special: { label: "特別快速",   color: "#FFD700",  thick: false },
  home_liner:    { label: "ホームライナー", color: "#FF6B6B", thick: false },
  express:       { label: "特急",       color: "#FF6B6B",  thick: true  },
};

// ============================================================
// 状態
// ============================================================
let currentGroup   = "shinkansen"; // "shinkansen" | "zairaisen"
let currentLineKey = null;
let currentLine    = null;         // { stations, trains, startHour, endHour, lineName, ... }
let currentType    = "shinkansen"; // tracks which color system

// ハロ（強調表示）
let highlightedTrain = null;

// 新幹線: 日別アーカイブ（archive/index.json の日付一覧と、読み込み済みの日ごとのデータ）
const ARCHIVE_DIR      = "archive";
let archiveIndex       = null;          // { dates: [{ date, trains, kyushu, complete }] }
let currentShinDate    = null;          // "YYYY-MM-DD"
let currentShinDay     = null;          // 読み込んだ 1 日分（archive/YYYY-MM-DD.json）
const shinDayCache     = new Map();     // date → 1 日分（同じ日を何度も読み込まない）

// スクロールオフセット
const view = { offsetX: 24, offsetY: 24, scale: 1, minScale: 0.15, maxScale: 6 };

// ============================================================
// DOM要素
// ============================================================
const lineNameEl   = document.getElementById("line-name-display");
const lineDateEl   = document.getElementById("line-date-display");
const dateSelect   = document.getElementById("date-select");
const legendNote   = document.getElementById("legend-note");
const loadingSpinner = document.getElementById("loading-spinner");
const loadingTitleEl = document.getElementById("loading-title");
const unlockForm     = document.getElementById("unlock-form");
const unlockPass     = document.getElementById("unlock-pass");
const unlockRemember = document.getElementById("unlock-remember");
const unlockBtn      = document.getElementById("unlock-btn");
const unlockError    = document.getElementById("unlock-error");
const lockBtn        = document.getElementById("lock-btn");
const loadingEl    = document.getElementById("loading");
const loadingDetEl = document.getElementById("loading-detail");
const uiToggleBtn  = document.getElementById("ui-toggle");
const uiPanel      = document.getElementById("ui-panel");
const routeGroupTabs = document.getElementById("route-group-tabs");
const routeList    = document.getElementById("route-list");
const legendItems  = document.getElementById("legend-items");

const diagramArea  = document.getElementById("diagram-area");
const timeHeader   = document.getElementById("time-header");
const stationSidebar = document.getElementById("station-sidebar");
const diagCanvas   = document.getElementById("diagram-canvas");
const timeCanvas   = document.getElementById("time-canvas");
const stCanvas     = document.getElementById("station-canvas");
const diagCtx      = diagCanvas.getContext("2d");
const timeCtx      = timeCanvas.getContext("2d");
const stCtx        = stCanvas.getContext("2d");

// ============================================================
// UI パネルトグル
// ============================================================
let uiPanelOpen = false;

function setUiPanel(open) {
  uiPanelOpen = open;
  uiPanel.classList.toggle("hidden", !open);
  uiToggleBtn.textContent = open ? "✕" : "☰";
}

uiToggleBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  setUiPanel(!uiPanelOpen);
});

// パネル外クリックで閉じる
document.addEventListener("click", (e) => {
  if (uiPanelOpen && !uiPanel.contains(e.target) && e.target !== uiToggleBtn) {
    setUiPanel(false);
  }
});

// ============================================================
// 路線グループタブ
// ============================================================
routeGroupTabs.addEventListener("click", (e) => {
  const tab = e.target.closest(".group-tab");
  if (!tab) return;
  const group = tab.dataset.group;
  if (group === currentGroup) return;
  currentGroup = group;
  document.querySelectorAll(".group-tab").forEach(t => t.classList.toggle("active", t.dataset.group === group));
  updateDateRowVisibility();
  renderRouteList();
});

// ============================================================
// 新幹線: 運転日の選択（日別アーカイブ）
// ============================================================
const WEEKDAYS_JA = "日月火水木金土";

// "2026-11-19" → "2026/11/19(木)"
function formatDateJa(date) {
  const [y, m, d] = date.split("-").map(Number);
  const w = WEEKDAYS_JA[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return `${y}/${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}(${w})`;
}

// 日付プルダウンは新幹線タブを選んでいる時だけ表示
function updateDateRowVisibility() {
  dateSelect.classList.toggle("hidden", currentGroup !== "shinkansen");
}

// 現在読み込んでいる新幹線の 1 日分を、在来線データと同じ { lines: {...} } 形で返す
function shinkansenData() {
  if (!currentShinDay || !currentShinDay.line) return null;
  return { lines: { [currentShinDay.line.lineKey]: currentShinDay.line } };
}

// ============================================================
// データの読み込み（公開 Pages では暗号化データを復号、手元では平文）
//   data/meta.json がある → 暗号化モード: パスワードから鍵を作り data/*.bin を復号
//   無い              → 平文モード: archive/*.json と zairaisen-data.js をそのまま読む
// 暗号方式は pages-crypto.ts と同じ（PBKDF2-SHA256 → AES-GCM-256、gzip 圧縮、"TDE1"+IV+暗号文）
// ============================================================
const ENC_MAGIC   = "TDE1";
const CHECK_TEXT  = "train-diagram-ok";
const KEY_DB_NAME = "train-diagram";
const dataStore   = { mode: "plain", meta: null, key: null };

function b64ToBytes(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decryptBytes(key, data) {
  const d = new Uint8Array(data);
  for (let i = 0; i < 4; i++) {
    if (d[i] !== ENC_MAGIC.charCodeAt(i)) throw new Error("暗号化ファイルの形式が違います");
  }
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: d.slice(4, 16) }, key, d.slice(16));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// パスワード → AES 鍵（取り出し不可・復号専用）
async function deriveAesKey(password, meta) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(meta.salt), iterations: meta.iterations }, base, 512));
  return crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
}

async function keyIsValid(key, meta) {
  try {
    const plain = await decryptBytes(key, b64ToBytes(meta.check));
    return new TextDecoder().decode(plain) === CHECK_TEXT;
  } catch {
    return false;
  }
}

// この端末に鍵を保存（IndexedDB。鍵は取り出し不可の CryptoKey のまま保存される）
function keyDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(KEY_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore("keys");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function keyDbOp(mode, fn) {
  const db = await keyDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("keys", mode);
    const req = fn(tx.objectStore("keys"));
    tx.oncomplete = () => { db.close(); resolve(req?.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
const keyId = (meta) => `${meta.salt}:${meta.iterations}`;
async function loadSavedKey(meta) {
  try { return (await keyDbOp("readonly", (s) => s.get(keyId(meta)))) || null; } catch { return null; }
}
async function saveKey(meta, key) {
  try { await keyDbOp("readwrite", (s) => s.put(key, keyId(meta))); } catch (e) { console.warn("鍵を保存できません", e); }
}
async function forgetKeys() {
  try { await keyDbOp("readwrite", (s) => s.clear()); } catch { /* 何もしない */ }
}

// パスワード入力画面を出し、正しい鍵ができるまで待つ
function askPassword(meta) {
  return new Promise((resolve) => {
    unlockForm.classList.remove("hidden");
    loadingSpinner.classList.add("hidden");
    loadingTitleEl.textContent = "パスワードを入力";
    loadingDetEl.textContent = "このページは本人専用です。";
    unlockPass.focus();
    unlockForm.addEventListener("submit", async function onSubmit(e) {
      e.preventDefault();
      unlockError.textContent = "";
      unlockBtn.disabled = true;
      unlockBtn.textContent = "確認中...";
      try {
        const key = await deriveAesKey(unlockPass.value, meta);
        if (await keyIsValid(key, meta)) {
          if (unlockRemember.checked) await saveKey(meta, key);
          unlockForm.removeEventListener("submit", onSubmit);
          unlockForm.classList.add("hidden");
          loadingSpinner.classList.remove("hidden");
          loadingTitleEl.textContent = "ダイヤデータを準備中";
          loadingDetEl.textContent = "データを復号しています...";
          resolve(key);
          return;
        }
        unlockError.textContent = "パスワードが違います。";
      } catch (err) {
        console.error(err);
        unlockError.textContent = "このブラウザでは開けません（暗号機能が使えません）。";
      } finally {
        unlockBtn.disabled = false;
        unlockBtn.textContent = "開く";
      }
    });
  });
}

async function initDataStore() {
  let meta = null;
  try {
    const res = await fetch("data/meta.json", { cache: "no-cache" });
    if (res.ok) meta = await res.json();
  } catch { /* 平文モード */ }
  if (!meta) { dataStore.mode = "plain"; return; }

  dataStore.mode = "encrypted";
  dataStore.meta = meta;
  lockBtn.classList.remove("hidden");
  const saved = await loadSavedKey(meta);
  dataStore.key = (saved && await keyIsValid(saved, meta)) ? saved : await askPassword(meta);
}

// "archive/2026-11-19.json" → 暗号化モードでは "data/archive/2026-11-19.bin"
function encryptedPath(name) {
  if (name === "zairaisen-data.js") return "data/zairaisen.bin";
  const m = /^archive\/(.+)\.json$/.exec(name);
  if (m) return `data/archive/${m[1]}.bin`;
  throw new Error(`暗号化データの対応先がありません: ${name}`);
}

async function readDataText(name, useCache) {
  const url = dataStore.mode === "encrypted" ? encryptedPath(name) : name;
  const res = await fetch(url, { cache: useCache ? "default" : "no-cache" });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  if (dataStore.mode !== "encrypted") return res.text();
  return new TextDecoder().decode(await decryptBytes(dataStore.key, await res.arrayBuffer()));
}

async function fetchJsonNoStore(url, useCache) {
  return JSON.parse(await readDataText(url, useCache));
}

// 在来線データ（window.ZAIRAISEN_DATA = {...}; 形式の JS）を読み込む
async function loadZairaisen() {
  if (dataStore.mode === "encrypted") {
    const text = await readDataText("zairaisen-data.js", false);
    new Function("window", text)(window);
    return;
  }
  await new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "zairaisen-data.js";
    s.onload = resolve;
    s.onerror = () => { console.warn("zairaisen-data.js が見つかりません"); resolve(); };
    document.head.appendChild(s);
  });
}

  archiveIndex = await fetchJsonNoStore(`${ARCHIVE_DIR}/index.json`, false);
  const dates = (archiveIndex.dates || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  archiveIndex.dates = dates;

async function fetchShinDay(date) {
  if (shinDayCache.has(date)) return shinDayCache.get(date);
  // 最新日は同じ日に再取得されることがあるので毎回確認、過去日はブラウザのキャッシュを使う
  const isLatest = archiveIndex?.dates?.[0]?.date === date;
  const day = await fetchJsonNoStore(`${ARCHIVE_DIR}/${date}.json`, !isLatest);
  shinDayCache.set(date, day);
  return day;
}

// 指定日の新幹線ダイヤを読み込んで表示する（表示位置・拡大率は保つ）
async function selectShinDate(date, { keepView = true, silent = false } = {}) {
  dateSelect.disabled = true;
  try {
    const day = await fetchShinDay(date);
    // 選択中にさらに別の日が選ばれていたら古い結果は捨てる
    if (dateSelect.value !== date) return false;
    currentShinDate = date;
    currentShinDay  = day;
    // 在来線を表示中に日付を選んだ場合も、その日の新幹線ダイヤに切り替える
    loadLine("shinkansen", day.line.lineKey, { keepView: keepView && currentType === "shinkansen" });
    return true;
  } catch (err) {
    console.error(err);
    // プルダウンを表示中の日に戻す（同じ日を選び直して再試行できるように）
    dateSelect.value = currentShinDate ?? "";
    if (!silent) alert(`${formatDateJa(date)} のダイヤを読み込めませんでした。`);
    return false;
  } finally {
    dateSelect.disabled = false;
  }
}

// ============================================================
// 在来線: 0時またぎ補正（最大ギャップ法）
// ============================================================
function normalizeMidnightCrossing(trains) {
  // 時刻文字列を分に変換（異常値も正規化）
  function t2m(t) {
    if (!t) return Infinity;
    const [h, m] = t.split(":").map(Number);
    const normalH = h >= 30 ? h - 24 : h;
    return normalH * 60 + m;
  }

  function addH24(t) {
    if (!t) return t;
    const [h, m] = t.split(":").map(Number);
    const normalH = h >= 30 ? h - 24 : h;
    return `${normalH + 24}:${String(m).padStart(2, "0")}`;
  }

  return trains.map(train => {
    // ディープコピーで元データを保護
    const stops = train.stops.map(s => ({ ...s }));

    // 異常値（h >= 30）を正規化してソート
    stops.sort((a, b) => t2m(a.dep || a.arr) - t2m(b.dep || b.arr));

    if (stops.length < 2) return { ...train, stops };

    // 最大ギャップを探索して0時またぎ境界を検出
    let maxGap = 0, splitIdx = -1;
    for (let i = 1; i < stops.length; i++) {
      const gap = t2m(stops[i].dep || stops[i].arr) - t2m(stops[i - 1].dep || stops[i - 1].arr);
      if (gap > maxGap) { maxGap = gap; splitIdx = i; }
    }

    // 3時間超のギャップは0時をまたいでいると判断
    if (maxGap > 3 * 60 && splitIdx > 0) {
      // ギャップより前のグループ（深夜0時台）に+24hを加算
      for (let j = 0; j < splitIdx; j++) {
        stops[j].arr = stops[j].arr ? addH24(stops[j].arr) : stops[j].arr;
        stops[j].dep = stops[j].dep ? addH24(stops[j].dep) : stops[j].dep;
      }
      // 再ソート
      stops.sort((a, b) => t2m(a.dep || a.arr) - t2m(b.dep || b.arr));
    }

    return { ...train, stops };
  });
}

// ============================================================
// 東海道線（熱海〜豊橋 + 豊橋〜米原）連結
// ============================================================
function buildMergedTokaido(zaiData) {
  const east = zaiData.lines["tokaido_east"];
  const west = zaiData.lines["tokaido_west"];
  if (!east || !west) return null;

  const eastSt  = east.stations;                       // si:0=熱海 〜 si:N=豊橋
  const westSt  = west.stations;                       // si:0=豊橋 〜 si:M=米原
  const eastLen = eastSt.length;                       // 豊橋のsi = eastLen-1
  const toyoKm  = eastSt[eastLen - 1].km;              // 豊橋のキロ程（熱海起点）

  // 駅リスト: 東側そのまま + 西側の豊橋（si:0）を除いてキロ程を熱海起点にオフセット
  const mergedStations = [
    ...eastSt,
    ...westSt.slice(1).map(s => ({ name: s.name, km: toyoKm + s.km })),
  ];

  // 列車のマージ: 同一 trainNo+dir を1本に統合（区間またぎ列車）
  const trainMap = new Map(); // `${trainNo}_${dir}` → train

  for (const t of east.trains) {
    const key = `${t.trainNo}_${t.dir}`;
    trainMap.set(key, { ...t, stops: t.stops.map(s => ({ ...s })) });
  }

  for (const t of west.trains) {
    const key = `${t.trainNo}_${t.dir}`;
    // 西側のsi変換: si:0(豊橋) → eastLen-1、si:N → eastLen+N-1
    const converted = t.stops.map(s => ({
      ...s,
      si: s.si === 0 ? eastLen - 1 : eastLen + s.si - 1,
    }));

    if (trainMap.has(key)) {
      // 区間またぎ列車: 豊橋の重複ストップを除外してマージ
      const existing = trainMap.get(key);
      const nonDup   = converted.filter(s => s.si !== eastLen - 1);
      existing.stops = [...existing.stops, ...nonDup];
    } else {
      trainMap.set(key, { ...t, stops: converted });
    }
  }

  return {
    lineKey:   "tokaido_merged",
    lineName:  "東海道線",
    lineColor: east.lineColor,
    startHour: Math.min(east.startHour ?? 3, west.startHour ?? 3),
    endHour:   Math.max(east.endHour   ?? 27, west.endHour  ?? 27),
    stations:  mergedStations,
    trains:    Array.from(trainMap.values()),
  };
}

// ============================================================
// 路線ロード
// ============================================================
function loadLine(group, key, { keepView = false } = {}) {
  const data   = group === "shinkansen" ? shinkansenData() : window.ZAIRAISEN_DATA;
  const prefix = group === "shinkansen" ? "shinkansen_" : "zairaisen_";
  if (!data || !data.lines) return;

  // 東海道線連結路線の仮想キー処理
  let ld;
  if (group === "zairaisen" && key === "tokaido_merged") {
    ld = buildMergedTokaido(data);
    if (!ld) return;
  } else {
    if (!data.lines[key]) return;
    ld = data.lines[key];
  }

  // 日付切替で表示位置を保つ場合は、切替前の時間軸の起点とハロ中の列車を覚えておく
  const prevStartHour = currentLine?.startHour;
  const prevHL = (keepView && highlightedTrain !== null) ? currentLine?.trains[highlightedTrain] : null;

  currentLineKey = prefix + key;
  currentType    = group;

  // 在来線の場合: 0時またぎ列車を正規化（ディープコピーして元データを汚染しない）
  let trains = ld.trains;
  if (group === "zairaisen") {
    trains = normalizeMidnightCrossing(ld.trains);
  }

  currentLine    = {
    lineName:  ld.lineName,
    stations:  ld.stations,
    trains,
    startHour: ld.startHour ?? (group === "shinkansen" ? 6 : 3),
    endHour:   ld.endHour   ?? (group === "shinkansen" ? 24 : 27),
    // 新幹線: 九州区間の状態（"through-only" / "full" / "missing" / "not-collected"）
    kyushu:    group === "shinkansen" ? (currentShinDay?.kyushu ?? null) : null,
  };

  // ハロ: 同じ列車（種別・番号・方向が一致）が新しい日にもあれば引き継ぐ
  highlightedTrain = null;
  if (prevHL) {
    const idx = trains.findIndex(t => t.kind === prevHL.kind && t.trainNo === prevHL.trainNo && t.dir === prevHL.dir);
    if (idx >= 0) highlightedTrain = idx;
  }

  if (group === "shinkansen") {
    // 左上: 路線は「東京〜鹿児島中央」と短く、上段に表示中の運転日を小さく出す
    lineNameEl.textContent = `${ld.stations[0].name}〜${ld.stations.at(-1).name}`;
    lineDateEl.textContent = currentShinDate ? formatDateJa(currentShinDate) : "";
    lineDateEl.classList.add("date");
  } else {
    lineNameEl.textContent = ld.lineName;
    lineDateEl.textContent = "Line View";
    lineDateEl.classList.remove("date");
  }
  applySidebarWidth(calcSidebarWidth(ld.stations));
  resizeAll();
  if (keepView && prevStartHour != null) {
    // 時間軸の起点が変わっても同じ時刻が同じ位置に来るよう補正
    view.offsetX += (currentLine.startHour - prevStartHour) * 60 * PX_PER_MIN * view.scale;
    clampView();
    drawAll();
  } else {
    resetView();
  }
  renderLegend();
  renderRouteList();
}

// ============================================================
// ユーティリティ
// ============================================================
function timeToMin(t) {
  const [h, m] = t.split(":").map(Number);
  // h >= 30 は API の異常値（例: 47:56 → 本来は 23:56）を正規化する
  const normalH = h >= 30 ? h - 24 : h;
  return normalH * 60 + m;
}

function startMin() { return (currentLine?.startHour ?? 6) * 60; }
function endMin()   { return (currentLine?.endHour   ?? 24) * 60; }

function xOfMin(min) {
  return (min - startMin()) * PX_PER_MIN * view.scale + view.offsetX;
}
function yOfKm(km) {
  const pxKm = currentType === "zairaisen" ? PX_PER_KM_ZAI : PX_PER_KM_SHIN;
  return km * pxKm * view.scale + view.offsetY;
}

function trainColor(train) {
  if (currentType === "shinkansen") {
    return (SHINKANSEN_META[train.kind] || SHINKANSEN_META.kodama).color;
  }
  return (ZAIRAISEN_META[train.kind] || ZAIRAISEN_META.local).color;
}

function isExpressThick(train) {
  return currentType === "zairaisen" && (ZAIRAISEN_META[train.kind] || {}).thick;
}

function calcSidebarWidth(stations) {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = `700 14px ${FONT}`;
  let max = 0;
  for (const st of stations) max = Math.max(max, ctx.measureText(st.name).width);
  return Math.ceil(max) + 22;
}

function applySidebarWidth(w) {
  document.documentElement.style.setProperty("--sidebar-w", `${w}px`);
}

function resizeCanvas(canvas, w, h) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.max(1, Math.floor(w * dpr));
  canvas.height = Math.max(1, Math.floor(h * dpr));
  canvas.style.width  = `${w}px`;
  canvas.style.height = `${h}px`;
  canvas.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resizeAll() {
  resizeCanvas(diagCanvas, diagramArea.clientWidth, diagramArea.clientHeight);
  resizeCanvas(timeCanvas,  timeHeader.clientWidth, TIME_H);
  resizeCanvas(stCanvas,    stationSidebar.clientWidth, stationSidebar.clientHeight);
}

// ============================================================
// ビュー操作
// ============================================================
function clampView() {
  const pad  = 34;
  const cw   = (endMin() - startMin()) * PX_PER_MIN * view.scale;
  const pxKm = currentType === "zairaisen" ? PX_PER_KM_ZAI : PX_PER_KM_SHIN;
  const ch   = currentLine?.stations.at(-1)?.km * pxKm * view.scale || 0;
  const dw   = diagramArea.clientWidth;
  const dh   = diagramArea.clientHeight;

  if (cw + pad * 2 <= dw) view.offsetX = (dw - cw) / 2;
  else view.offsetX = Math.min(pad, Math.max(dw - cw - pad, view.offsetX));

  if (ch + pad * 2 <= dh) view.offsetY = (dh - ch) / 2;
  else view.offsetY = Math.min(pad, Math.max(dh - ch - pad, view.offsetY));
}

function resetView() {
  view.scale   = 1;
  view.offsetX = 24;
  view.offsetY = 24;
  clampView();
  drawAll();
}

function zoom(factor, cx, cy) {
  const ns = Math.max(view.minScale, Math.min(view.maxScale, view.scale * factor));
  if (ns === view.scale) return;
  const r = ns / view.scale;
  view.offsetX = (cx ?? diagramArea.clientWidth  / 2) - ((cx ?? diagramArea.clientWidth  / 2) - view.offsetX) * r;
  view.offsetY = (cy ?? diagramArea.clientHeight / 2) - ((cy ?? diagramArea.clientHeight / 2) - view.offsetY) * r;
  view.scale = ns;
  clampView();
  drawAll();
}

// ============================================================
// 描画: 時間ヘッダー（スマホスクロール対応）
// ============================================================
function drawTimeHeader() {
  const w = timeCanvas.clientWidth;
  timeCtx.clearRect(0, 0, w, TIME_H);
  timeCtx.fillStyle = "rgba(7,17,33,0.95)";
  timeCtx.fillRect(0, 0, w, TIME_H);

  if (!currentLine) return;

  const sMin = startMin();
  const eMin = endMin();

  for (let min = sMin; min <= eMin; min += 2) {
    const x = xOfMin(min);
    if (x < -60 || x > w + 60) continue;
    const moh = min % 60;
    if (moh === 0) {
      // 整時ラベル（固定表示対応は後段で上書き）
      timeCtx.fillStyle = "rgba(236,240,241,0.96)";
      timeCtx.font = `800 22px ${FONT}`;
      timeCtx.textAlign = "center";
      timeCtx.textBaseline = "middle";
      timeCtx.fillText(String(Math.floor(min / 60)), x, 22);
    } else if (moh % 10 === 0) {
      timeCtx.fillStyle = "rgba(159,184,214,0.9)";
      timeCtx.font = `11px ${FONT}`;
      timeCtx.textAlign = "center";
      timeCtx.textBaseline = "middle";
      timeCtx.fillText(String(moh), x, 40);
    }
  }

  // 整時ラベルの左端固定表示
  // 画面左端より左にある整時 → 固定表示
  for (let h = Math.floor(sMin / 60); h <= Math.floor(eMin / 60); h++) {
    const min = h * 60;
    const x   = xOfMin(min);

    // 次の整時のx座標
    const xNext = xOfMin((h + 1) * 60);

    // この整時が画面外（左）にある かつ 次の整時がまだ表示領域内
    if (x < 0 && xNext > 0) {
      // 固定: 左端に表示、次の整時が画面内に入ったら自然消滅
      const displayX = Math.max(0, Math.min(xNext - 30, 20));
      timeCtx.fillStyle = "rgba(236,240,241,0.96)";
      timeCtx.font = `800 22px ${FONT}`;
      timeCtx.textAlign = "center";
      timeCtx.textBaseline = "middle";
      timeCtx.fillText(String(h), displayX, 22);
    }
  }

  // 下ボーダー
  timeCtx.strokeStyle = "rgba(117,144,184,0.25)";
  timeCtx.lineWidth = 1;
  timeCtx.beginPath();
  timeCtx.moveTo(0, TIME_H - 0.5);
  timeCtx.lineTo(w, TIME_H - 0.5);
  timeCtx.stroke();
}

// ============================================================
// 描画: 駅サイドバー
// ============================================================
// 駅ごとの停車本数（駅名の表示優先度）。両端の駅は常に最優先。
function stationPriority(line) {
  if (line._priority) return line._priority;
  const count = new Array(line.stations.length).fill(0);
  for (const t of line.trains) {
    for (const s of t.stops) if (!s.gap && (s.arr || s.dep)) count[s.si] += 1;
  }
  count[0] = Infinity;
  count[count.length - 1] = Infinity;
  line._priority = count;
  return count;
}

function drawStationLabelsNoOverlap(w, h, sf, kf) {
  const stations = currentLine.stations;
  const prio = stationPriority(currentLine);
  const order = stations.map((_, i) => i).sort((a, b) => (prio[b] - prio[a]) || (a - b));
  const placed = [];  // [top, bottom]
  const free = (top, bottom) => placed.every(([t, b]) => bottom <= t || top >= b);

  for (const i of order) {
    const st = stations[i];
    const y = yOfKm(st.km);
    if (y < -28 || y > h + 28) continue;

    const nameTop = y - 5 - sf / 2, nameBottom = y - 5 + sf / 2;
    if (!free(nameTop, nameBottom)) continue;
    placed.push([nameTop, nameBottom]);
    stCtx.fillStyle = "#ecf0f1";
    stCtx.font = `700 ${sf}px ${FONT}`;
    stCtx.textAlign = "right";
    stCtx.textBaseline = "middle";
    stCtx.fillText(st.name, w - 8, y - 5);

    if (view.scale >= 0.6) {
      const kmTop = y + 9 - kf / 2, kmBottom = y + 9 + kf / 2;
      if (!free(kmTop, kmBottom)) continue;
      placed.push([kmTop, kmBottom]);
      stCtx.fillStyle = "#7ec8e3";
      stCtx.font = `${kf}px ${FONT}`;
      stCtx.fillText(`${st.km.toFixed(1)} km`, w - 8, y + 9);
    }
  }
}

function drawStationSidebar() {
  const w = stCanvas.clientWidth;
  const h = stCanvas.clientHeight;
  stCtx.clearRect(0, 0, w, h);
  stCtx.fillStyle = "rgba(7,17,33,0.95)";
  stCtx.fillRect(0, 0, w, h);

  if (!currentLine) return;

  const sf = Math.max(10, Math.min(14, 14 / Math.sqrt(Math.max(view.scale, 0.8))));
  const kf = Math.max(8,  Math.min(11, 11 / Math.sqrt(Math.max(view.scale, 0.8))));

  // 新幹線: 駅間が短い駅（東京・品川、新鳥栖・久留米など）は駅名やキロが重なるため、
  // 停車本数の多い駅から順に置き、重なる駅名・キロは間引く（拡大すると全駅が表示される）。
  // 在来線は従来どおり全駅を描く。
  if (currentType === "shinkansen") {
    drawStationLabelsNoOverlap(w, h, sf, kf);
  } else for (const st of currentLine.stations) {
    const y = yOfKm(st.km);
    if (y < -28 || y > h + 28) continue;

    stCtx.fillStyle = "#ecf0f1";
    stCtx.font = `700 ${sf}px ${FONT}`;
    stCtx.textAlign = "right";
    stCtx.textBaseline = "middle";
    stCtx.fillText(st.name, w - 8, y - 5);

    if (view.scale >= 0.6) {
      stCtx.fillStyle = "#7ec8e3";
      stCtx.font = `${kf}px ${FONT}`;
      stCtx.fillText(`${st.km.toFixed(1)} km`, w - 8, y + 9);
    }
  }

  stCtx.strokeStyle = "rgba(117,144,184,0.25)";
  stCtx.lineWidth = 1;
  stCtx.beginPath();
  stCtx.moveTo(w - 0.5, 0);
  stCtx.lineTo(w - 0.5, h);
  stCtx.stroke();
}

// ============================================================
// 描画: ダイヤグラム
// ============================================================
function drawDiagram() {
  const w = diagCanvas.clientWidth;
  const h = diagCanvas.clientHeight;
  diagCtx.clearRect(0, 0, w, h);
  diagCtx.fillStyle = "#0a1424";
  diagCtx.fillRect(0, 0, w, h);

  if (!currentLine) return;

  const sMin = startMin();
  const eMin = endMin();

  // ---- 時間グリッド線（明るく） ----
  for (let min = sMin; min <= eMin; min += 2) {
    const x   = xOfMin(min);
    if (x < 0 || x > w) continue;
    const moh = min % 60;

    diagCtx.beginPath();
    diagCtx.moveTo(x, 0);
    diagCtx.lineTo(x, h);

    if (moh === 0) {
      diagCtx.strokeStyle = "rgba(236,240,241,0.55)";
      diagCtx.lineWidth   = 1.5;
      diagCtx.setLineDash([]);
    } else if (moh % 10 === 0) {
      diagCtx.strokeStyle = "rgba(180,210,250,0.55)";
      diagCtx.lineWidth   = 0.9;
      diagCtx.setLineDash([]);
    } else {
      diagCtx.strokeStyle = "rgba(160,195,240,0.42)";
      diagCtx.lineWidth   = 0.7;
      diagCtx.setLineDash([2, 3]);
    }
    diagCtx.stroke();
  }
  diagCtx.setLineDash([]);

  // ---- 駅横線 ----
  // 新幹線: のぞみ停車駅 = 太線
  // 在来線: 特急停車駅 = 太線 (特急なければ快速停車駅)
  const thickStations = new Set();
  const fallbackStations = new Set();

  if (currentType === "shinkansen") {
    for (const train of currentLine.trains) {
      if (train.kind === "nozomi") {
        for (const s of train.stops) thickStations.add(s.si);
      }
    }
  } else {
    const hasExpress = currentLine.trains.some(t => t.kind === "express");
    for (const train of currentLine.trains) {
      if (train.kind === "express") {
        for (const s of train.stops) thickStations.add(s.si);
      }
      if (!hasExpress && (train.kind === "rapid" || train.kind === "rapid_local" ||
          train.kind === "rapid_new" || train.kind === "rapid_special")) {
        for (const s of train.stops) fallbackStations.add(s.si);
      }
    }
    if (!hasExpress) {
      for (const si of fallbackStations) thickStations.add(si);
    }
  }

  for (let i = 0; i < currentLine.stations.length; i++) {
    const y = yOfKm(currentLine.stations[i].km);
    if (y < 0 || y > h) continue;
    if (thickStations.has(i)) {
      diagCtx.strokeStyle = "rgba(220,235,255,0.48)";
      diagCtx.lineWidth   = 1.2;
    } else {
      diagCtx.strokeStyle = "rgba(180,200,225,0.20)";
      diagCtx.lineWidth   = 0.7;
    }
    diagCtx.beginPath();
    diagCtx.moveTo(0, y);
    diagCtx.lineTo(w, y);
    diagCtx.stroke();
  }

  // ---- 九州区間にデータが無い日: 区間を薄く塗って文字で知らせる ----
  drawKyushuMissingBand(w, h);

  // ---- 列車線 ----
  const baseLineW  = Math.max(0.8, Math.min(2, 1.4 / Math.sqrt(view.scale)));
  const shouldLabel = view.scale >= 0.4;

  // キャッシュ: ハロ判定用に各列車の描画セグメントを保持
  const trainSegments = [];

  for (let ti = 0; ti < currentLine.trains.length; ti++) {
    const train = currentLine.trains[ti];
    const stops = train.stops.filter(s => currentLine.stations[s.si]);
    if (stops.length < 2) continue;

    const color  = trainColor(train);
    const isHL   = highlightedTrain === ti;
    const lw     = isExpressThick(train) ? baseLineW * 2.2 : baseLineW;

    if (isHL) {
      // グロー効果
      diagCtx.save();
      diagCtx.strokeStyle = color;
      diagCtx.lineWidth   = lw + 6;
      diagCtx.globalAlpha = 0.22;
      diagCtx.shadowColor = color;
      diagCtx.shadowBlur  = 14;
      strokeTrain(diagCtx, stops);
      diagCtx.restore();
    }

    diagCtx.strokeStyle = isHL ? "#ffffff" : color;
    diagCtx.lineWidth   = isHL ? lw + 1.5 : lw;
    diagCtx.globalAlpha = (highlightedTrain !== null && !isHL) ? 0.3 : 1.0;
    diagCtx.setLineDash([]);
    strokeTrain(diagCtx, stops);
    diagCtx.globalAlpha = 1.0;

    // セグメント収集（ヒットテスト用）
    const segs = buildSegments(stops);
    trainSegments.push({ ti, color, segs });

    // ---- 列車番号ラベル ----
    if (!shouldLabel) continue;

    const trainNo = train.trainNo || (train.trainLabel ? train.trainLabel + train.trainNo : null);
    const label   = currentType === "shinkansen"
      ? ((train.trainLabel || "") + (train.trainNo || ""))
      : (train.trainNo || "");
    if (!label) continue;

    // ハロ表示中 → 画面内最初のセグメントに表示
    if (isHL) {
      drawLabelOnFirstVisibleSegment(diagCtx, segs, label, color, w);
    } else {
      drawLabelOnFirstSegment(diagCtx, segs, label, color);
    }
  }

  // ---- ハロ列車の再前面描画（他の線の上に来るよう）----
  // (上のループで既に描画済みなので省略)
}

function drawKyushuMissingBand(w, h) {
  if (currentType !== "shinkansen") return;
  const status = currentLine.kyushu?.status;
  if (status !== "not-collected" && status !== "missing") return;
  const hakata = currentLine.stations.find(st => st.name === "博多");
  const last   = currentLine.stations.at(-1);
  if (!hakata || last === hakata) return;

  const y0 = yOfKm(hakata.km);
  const y1 = yOfKm(last.km);
  const top = Math.max(0, y0), bottom = Math.min(h, y1);
  if (bottom <= top) return;

  diagCtx.save();
  diagCtx.fillStyle = "rgba(255,179,122,0.06)";
  diagCtx.fillRect(0, top, w, bottom - top);
  const text = status === "not-collected"
    ? "九州区間（博多〜鹿児島中央）のデータなし（過去分）"
    : "九州区間（博多〜鹿児島中央）のデータを取得できませんでした";
  const size = Math.max(11, Math.min(16, (bottom - top) / 4));
  diagCtx.font = `700 ${size}px ${FONT}`;
  diagCtx.fillStyle = "rgba(255,179,122,0.75)";
  diagCtx.textAlign = "center";
  diagCtx.textBaseline = "middle";
  diagCtx.fillText(text, w / 2, (top + bottom) / 2, w - 24);
  diagCtx.restore();
}

// 列車パスを ctx に描く（stroke なし）
// gapOnly=false: 通常の実線部分（途中駅の時刻が無い区間は飛ばす）
// gapOnly=true : 途中駅の時刻が無い区間（停車に gap が付いた区間）だけ
function drawTrainPath(ctx, stops, gapOnly = false) {
  ctx.beginPath();
  // ペン位置が前の区間の終点と同じなら lineTo だけで続ける（gap の無い列車は従来と同じ 1 本の折れ線になる）
  let pen = null;
  const segTo = (x0, y0, x1, y1) => {
    if (!pen || pen.x !== x0 || pen.y !== y0) ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    pen = { x: x1, y: y1 };
  };
  let prev = null;  // { x, y, gap }
  for (const s of stops) {
    const st  = currentLine.stations[s.si];
    const y   = yOfKm(st.km);
    const arr = s.arr || s.dep || s.t;
    const dep = s.dep || s.arr || s.t;
    if (!arr) continue;
    const xArr = xOfMin(timeToMin(arr));
    const xDep = xOfMin(timeToMin(dep));
    if (prev) {
      const isGap = !!(s.gap || prev.gap);
      if (isGap === gapOnly) segTo(prev.x, prev.y, xArr, y);
    } else if (!gapOnly) {
      ctx.moveTo(xArr, y);
      pen = { x: xArr, y };
    }
    if (!gapOnly && xDep > xArr) segTo(xArr, y, xDep, y);
    prev = { x: Math.max(xArr, xDep), y, gap: !!s.gap };
  }
}

function hasGap(stops) {
  return stops.some(s => s.gap);
}

// 実線 + 点線（途中駅の時刻が無い区間）をまとめて描く
function strokeTrain(ctx, stops) {
  drawTrainPath(ctx, stops, false);
  ctx.stroke();
  if (hasGap(stops)) {
    ctx.save();
    ctx.setLineDash([6, 5]);
    drawTrainPath(ctx, stops, true);
    ctx.stroke();
    ctx.restore();
  }
}

// 列車の各セグメントを配列で返す [{x0,y0,x1,y1}, ...]
function buildSegments(stops) {
  const segs = [];
  let prevDep = null;
  for (const s of stops) {
    const st  = currentLine.stations[s.si];
    if (!st) continue;
    const y   = yOfKm(st.km);
    const arr = s.arr || s.dep || s.t;
    const dep = s.dep || s.arr || s.t;
    if (!arr) continue;
    const xArr = xOfMin(timeToMin(arr));
    const xDep = xOfMin(timeToMin(dep));
    if (prevDep !== null) segs.push({ x0: prevDep.x, y0: prevDep.y, x1: xArr, y1: y });
    prevDep = { x: xDep, y };
  }
  return segs;
}

// 先頭セグメント（画面内の最初のもの）にラベルを描画
function drawLabelOnFirstSegment(ctx, segs, label, color) {
  for (const seg of segs) {
    const len = Math.hypot(seg.x1 - seg.x0, seg.y1 - seg.y0);
    if (len < 24) continue;
    const angle = Math.atan2(seg.y1 - seg.y0, seg.x1 - seg.x0);
    const px = seg.x0 + Math.cos(angle) * 10;
    const py = seg.y0 + Math.sin(angle) * 10;
    const size = Math.max(7, Math.min(11, 9 / Math.sqrt(Math.max(view.scale, 0.65))));
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.font = `700 ${size}px ${FONT}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur  = 5;
    ctx.fillText(label, 0, -2);
    ctx.restore();
    break;
  }
}

// ハロ列車: 画面内で最初に見えるセグメントにラベルを表示（四辺クランプ対応）
function drawLabelOnFirstVisibleSegment(ctx, segs, label, color, canvasW) {
  const canvasH = diagCanvas.clientHeight;
  const size = Math.max(8, Math.min(13, 11 / Math.sqrt(Math.max(view.scale, 0.65))));

  // テキスト幅を事前に計測（font設定後）
  ctx.font = `900 ${size}px ${FONT}`;
  const textW = ctx.measureText(label).width;
  const boxW  = textW + 6;
  const boxH  = size + 4;

  for (const seg of segs) {
    const minX = Math.min(seg.x0, seg.x1);
    const maxX = Math.max(seg.x0, seg.x1);
    if (maxX < 0 || minX > canvasW) continue;

    const len = Math.hypot(seg.x1 - seg.x0, seg.y1 - seg.y0);
    if (len < 12) continue;

    const angle = Math.atan2(seg.y1 - seg.y0, seg.x1 - seg.x0);

    // 画面左端からはみ出している場合は交点を始点に補正
    let startX = seg.x0;
    let startY = seg.y0;
    if (seg.x0 < 0 && seg.x1 > 0) {
      startX = 0;
      startY = seg.y0 + (seg.y1 - seg.y0) / (seg.x1 - seg.x0) * (0 - seg.x0);
    }

    // ラベル基準位置（セグメント上の少し先）
    let px = startX + Math.cos(angle) * 6;
    let py = startY + Math.sin(angle) * 6;

    // 四辺クランプ: ラベルボックスが画面内に収まるように調整
    // 回転を考慮した簡易クランプ（水平方向・垂直方向に補正）
    const margin = 4;
    px = Math.max(margin, Math.min(canvasW - boxW - margin, px));
    py = Math.max(boxH + margin, Math.min(canvasH - margin, py));

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);

    // 背景帯
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(-3, -(boxH - 1), boxW, boxH);

    ctx.fillStyle = "#ffffff";
    ctx.font = `900 ${size}px ${FONT}`;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText(label, 0, -1);
    ctx.restore();
    break;
  }
}

function drawAll() {
  drawDiagram();
  drawTimeHeader();
  drawStationSidebar();
}

// ============================================================
// 列車タップ（ハロ）
// ============================================================
const HIT_THRESH = 6; // px

function findTrainAtPoint(px, py) {
  if (!currentLine) return null;
  const baseLineW = Math.max(0.8, Math.min(2, 1.4 / Math.sqrt(view.scale)));

  for (let ti = currentLine.trains.length - 1; ti >= 0; ti--) {
    const train = currentLine.trains[ti];
    const stops = train.stops.filter(s => currentLine.stations[s.si]);
    if (stops.length < 2) continue;

    const lw    = (isExpressThick(train) ? baseLineW * 2.2 : baseLineW) + HIT_THRESH;
    const segs  = buildSegments(stops);

    for (const seg of segs) {
      if (distToSegment(px, py, seg.x0, seg.y0, seg.x1, seg.y1) <= lw) return ti;
    }
    // 停車横線
    for (const s of stops) {
      const st = currentLine.stations[s.si];
      if (!st) continue;
      const y   = yOfKm(st.km);
      const arr = s.arr || s.dep || s.t;
      const dep = s.dep || s.arr || s.t;
      if (!arr) continue;
      const xa  = xOfMin(timeToMin(arr));
      const xd  = xOfMin(timeToMin(dep));
      if (xd > xa && distToSegment(px, py, xa, y, xd, y) <= lw) return ti;
    }
  }
  return null;
}

function distToSegment(px, py, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - x0, py - y0);
  const t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / lenSq));
  return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
}

// ============================================================
// マウス操作
// ============================================================
let isDragging = false, lastX = 0, lastY = 0, dragMoved = false;

diagramArea.addEventListener("mousedown", (e) => {
  isDragging = true; dragMoved = false;
  lastX = e.clientX; lastY = e.clientY;
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  view.offsetX += dx; view.offsetY += dy;
  lastX = e.clientX; lastY = e.clientY;
  clampView(); drawAll();
});

window.addEventListener("mouseup", (e) => {
  if (isDragging && !dragMoved) {
    const rect = diagramArea.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const ti = findTrainAtPoint(px, py);
    if (ti !== null) {
      highlightedTrain = (highlightedTrain === ti) ? null : ti;
    } else {
      highlightedTrain = null;
    }
    drawAll();
  }
  isDragging = false;
});

diagramArea.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = diagramArea.getBoundingClientRect();
  zoom(e.deltaY < 0 ? 1.12 : 0.9, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// ============================================================
// タッチ操作
// ============================================================
let touchArr = [], pinchDist = 0, pinchMid = null, touchMoved = false;
let lastTapTime = 0, lastTapPos = null;

function getTouchDist(ts) {
  const dx = ts[0].clientX - ts[1].clientX, dy = ts[0].clientY - ts[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
function getTouchMid(ts) {
  return { x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2 };
}

diagramArea.addEventListener("touchstart", (e) => {
  e.preventDefault();
  touchArr = Array.from(e.touches); touchMoved = false;
  if (touchArr.length === 2) {
    pinchDist = getTouchDist(touchArr);
    pinchMid  = getTouchMid(touchArr);
  } else if (touchArr.length === 1) {
    lastX = touchArr[0].clientX; lastY = touchArr[0].clientY;
  }
}, { passive: false });

diagramArea.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const ts   = Array.from(e.touches);
  const rect = diagramArea.getBoundingClientRect();
  if (ts.length === 2 && touchArr.length === 2) {
    const nd = getTouchDist(ts), nm = getTouchMid(ts);
    if (pinchDist > 0) zoom(nd / pinchDist, nm.x - rect.left, nm.y - rect.top);
    view.offsetX += nm.x - pinchMid.x;
    view.offsetY += nm.y - pinchMid.y;
    pinchDist = nd; pinchMid = nm;
    touchMoved = true;
  } else if (ts.length === 1) {
    const dx = ts[0].clientX - lastX, dy = ts[0].clientY - lastY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) touchMoved = true;
    view.offsetX += dx; view.offsetY += dy;
    lastX = ts[0].clientX; lastY = ts[0].clientY;
  }
  touchArr = ts; clampView(); drawAll();
}, { passive: false });

diagramArea.addEventListener("touchend", (e) => {
  const rect    = diagramArea.getBoundingClientRect();
  const ended   = Array.from(e.changedTouches);
  touchArr = Array.from(e.touches);

  if (touchArr.length === 0 && ended.length === 1 && !touchMoved) {
    const tap = ended[0];
    const now = Date.now();
    const px  = tap.clientX - rect.left;
    const py  = tap.clientY - rect.top;

    // ダブルタップ→ズーム
    if (lastTapPos && now - lastTapTime < 280 &&
        Math.hypot(tap.clientX - lastTapPos.x, tap.clientY - lastTapPos.y) < 28) {
      zoom(1.35, px, py);
      lastTapTime = 0; lastTapPos = null;
    } else {
      // ハロ判定
      const ti = findTrainAtPoint(px, py);
      if (ti !== null) {
        highlightedTrain = (highlightedTrain === ti) ? null : ti;
      } else {
        highlightedTrain = null;
      }
      drawAll();
      lastTapTime = now; lastTapPos = { x: tap.clientX, y: tap.clientY };
    }
  }
  if (touchArr.length < 2) { pinchDist = 0; pinchMid = null; }
});

// ============================================================
// リサイズ
// ============================================================
window.addEventListener("resize", () => {
  if (!currentLine) return;
  resizeAll(); clampView(); drawAll();
});

// ============================================================
// 初期化
// ============================================================
async function initialize() {
  // 暗号化データならパスワード（または保存済みの鍵）で開く
  try {
    await initDataStore();
    await loadZairaisen();
  } catch (err) {
    console.error(err);
    loadingDetEl.textContent = "データを読み込めませんでした。\n時間をおいて再読み込みしてください。";
    return;
  }
  const zai  = window.ZAIRAISEN_DATA;

  if (!zai || !zai.lines) {
    loadingDetEl.textContent =
      "在来線データが見つかりません。\nzairaisen-data.js を確認してください。";
    return;
  }

  updateDateRowVisibility();

  // 新幹線: 日付一覧を読み込み、最新日を表示する
  let dates;
  try {
    dates = await loadArchiveIndex();
  } catch (err) {
    console.error(err);
    loadingDetEl.textContent =
      "新幹線の日付一覧（archive/index.json）を読み込めません。\n" +
      "ローカルでは bunx serve -l 8000 . で開いてください。\n" +
      "データが無い場合は bun fetch-diagram.ts を実行してください。";
    return;
  }
  if (dates.length === 0) {
    loadingDetEl.textContent = "新幹線のダイヤがまだありません。\nbun fetch-diagram.ts を実行してください。";
    return;
  }

  // 最新日から順に試し、読み込めた最初の日を表示する（最新日のファイルが壊れていても起動できるように）
  for (const e of dates.slice(0, 7)) {
    dateSelect.value = e.date;
    if (await selectShinDate(e.date, { keepView: false, silent: true })) break;
  }
  if (!currentLine) {
    loadingDetEl.textContent = "新幹線のダイヤを読み込めませんでした。\n時間をおいて再読み込みしてください。";
    return;
  }

  loadingEl.classList.add("hidden");
}

initialize();
</script>
