<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>東海道・山陽新幹線 ダイヤグラム</title>
  <style>
    :root {
      --bg-top: #081120;
      --bg-bottom: #132542;
      --panel-line: rgba(117, 144, 184, 0.25);
      --accent: #8cc9ff;
      --accent-strong: #38bdf8;
      --text-main: #ecf0f1;
      --text-sub: #9fb8d6;
      --station-km: #7ec8e3;
      --diagram-bg: #0a1424;
      --sidebar-w: 118px;
      --header-h: 58px;
      --time-h: 52px;
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(75, 181, 67, 0.12), transparent 28%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.25;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: 1fr;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px max(14px, env(safe-area-inset-left)) 12px max(14px, env(safe-area-inset-right));
      border-bottom: 1px solid var(--panel-line);
      background: linear-gradient(180deg, rgba(8, 16, 30, 0.92), rgba(8, 16, 30, 0.72));
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .brand .eyebrow {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand .title {
      color: var(--text-main);
      font-size: 19px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(140, 201, 255, 0.22);
      background: rgba(140, 201, 255, 0.12);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    #status-text {
      max-width: 360px;
      color: var(--text-sub);
      font-size: 12px;
      text-align: right;
      line-height: 1.4;
    }

    #workspace {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--time-h) 1fr;
      min-height: 0;
      min-width: 0;
      margin: 0;
      margin-left: env(safe-area-inset-left);
      margin-right: env(safe-area-inset-right);
      margin-bottom: env(safe-area-inset-bottom);
      margin-top: env(safe-area-inset-top);
      border: none;
      border-radius: 0;
      overflow: hidden;
      background: rgba(9, 18, 34, 0.45);
    }

    #corner,
    #time-header,
    #station-sidebar {
      background: linear-gradient(180deg, rgba(7, 17, 33, 0.96), rgba(13, 26, 46, 0.9));
    }

    #corner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      padding: 10px 12px;
      border-right: 1px solid var(--panel-line);
      border-bottom: 1px solid var(--panel-line);
    }

    #corner .line-small {
      color: var(--text-sub);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #corner .line-name {
      color: var(--text-main);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }

    #time-header,
    #station-sidebar,
    #diagram-area {
      position: relative;
      overflow: hidden;
    }

    #time-header {
      border-bottom: 1px solid var(--panel-line);
    }

    #station-sidebar {
      border-right: 1px solid var(--panel-line);
    }

    #diagram-area {
      cursor: grab;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.07), transparent 38%),
        var(--diagram-bg);
      touch-action: none;
    }

    #diagram-area:active {
      cursor: grabbing;
    }

    canvas {
      position: absolute;
      inset: 0;
    }

    #controls,
    #legend,
    #footer-meta {
      position: fixed;
      z-index: 10;
      backdrop-filter: blur(16px);
    }

    #legend {
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      min-width: 176px;
      padding: 12px 14px;
      border: 1px solid var(--panel-line);
      border-radius: 16px;
      background: rgba(7, 17, 33, 0.88);
      box-shadow: var(--shadow);
    }

    #legend h2 {
      margin-bottom: 9px;
      color: var(--text-main);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-sub);
      font-size: 12px;
    }

    .legend-row + .legend-row {
      margin-top: 6px;
    }

    .legend-sample {
      width: 28px;
      height: 3px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    #footer-meta {
      left: max(14px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--panel-line);
      border-radius: 14px;
      background: rgba(7, 17, 33, 0.74);
      color: var(--text-sub);
      font-size: 12px;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.14), transparent 35%),
        rgba(5, 11, 21, 0.92);
      backdrop-filter: blur(20px);
      transition: opacity 0.32s ease, visibility 0.32s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(420px, calc(100vw - 36px));
      padding: 28px 26px;
      border: 1px solid rgba(140, 201, 255, 0.16);
      border-radius: 24px;
      background: rgba(8, 16, 30, 0.9);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border: 3px solid rgba(140, 201, 255, 0.18);
      border-top-color: var(--accent-strong);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      color: var(--text-main);
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .loading-detail {
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      #status-text,
      #legend,
      #footer-meta {
        display: none;
      }
    }

    @media (max-width: 640px) {
      :root {
        --header-h: 64px;
        --time-h: 48px;
      }

      #topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .meta {
        width: 100%;
        justify-content: space-between;
      }

    }
  </style>
  <script src="diagram-data.js" onerror="console.warn('diagram-data.js が見つかりません。先に bun fetch-diagram.ts を実行してください。')"></script>
</head>
<body>
  <div id="loading">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-title">ダイヤデータを準備中</div>
      <div class="loading-detail" id="loading-detail">ローカルデータを確認しています...</div>
    </div>
  </div>

  <div id="app">
    <div id="workspace">
      <div id="corner">
        <div class="line-small">Line View</div>
        <div class="line-name" id="line-name-display">東海道・山陽新幹線（東京〜博多）</div>
      </div>
      <div id="time-header"><canvas id="time-canvas"></canvas></div>
      <div id="station-sidebar"><canvas id="station-canvas"></canvas></div>
      <div id="diagram-area"><canvas id="diagram-canvas"></canvas></div>
    </div>
  </div>

  <div id="legend">
    <h2>Train Types</h2>
    <div id="legend-rows"></div>
  </div>



  <div id="footer-meta">
    <span id="fetched-at">取得時刻: -</span>
    <span id="source-note">データソース: -</span>
  </div>

  <script>
    const DISPLAY_START_MIN = 6 * 60;
    const DISPLAY_END_MIN = 24 * 60;
    const PX_PER_MIN = 2.8;
    const PX_PER_KM = 2.15;
    const HEADER_H = 52;

    const TRAIN_META = {
      nozomi: { code: "6", label: "のぞみ", color: "#FFD700" },
      hikari: { code: "1", label: "ひかり", color: "#FF6B6B" },
      kodama: { code: "2", label: "こだま", color: "#5BB8FF" },
      mizuho: { code: "10", label: "みずほ", color: "#FF9040" },
      sakura: { code: "11", label: "さくら", color: "#FF85C0" },
      tsubame: { code: "12", label: "つばめ", color: "#D580FF" }
    };

    const lineNameDisplay = document.getElementById("line-name-display");
    const loadingEl = document.getElementById("loading");
    const loadingDetailEl = document.getElementById("loading-detail");
    const fetchedAtEl = document.getElementById("fetched-at");
    const sourceNoteEl = document.getElementById("source-note");
    const legendRowsEl = document.getElementById("legend-rows");

    const diagramArea = document.getElementById("diagram-area");
    const timeHeader = document.getElementById("time-header");
    const stationSidebar = document.getElementById("station-sidebar");
    const diagramCanvas = document.getElementById("diagram-canvas");
    const timeCanvas = document.getElementById("time-canvas");
    const stationCanvas = document.getElementById("station-canvas");
    const diagramCtx = diagramCanvas.getContext("2d");
    const timeCtx = timeCanvas.getContext("2d");
    const stationCtx = stationCanvas.getContext("2d");

    let sidebarWidth = 118;
    let currentLine = null;
    let diagramData = null;
    let currentSource = "local";
    let nozomiStationSet = new Set();

    const view = {
      offsetX: 24,
      offsetY: 24,
      scale: 1,
      minScale: 0.15,
      maxScale: 6
    };

    function setLoading(message) {
      loadingDetailEl.textContent = message;
    }

    function timeToMinutes(value) {
      const [hour, minute] = value.split(":").map(Number);
      return hour * 60 + minute;
    }

    function trainMetaByKind(kind) {
      return TRAIN_META[kind] || { label: kind, color: "#ffffff" };
    }

    function trainColor(train) {
      return trainMetaByKind(train.kind).color;
    }

    function calcSidebarWidth(stations) {
      const ctx = document.createElement("canvas").getContext("2d");
      let maxWidth = 0;
      for (const station of stations) {
        ctx.font = "700 14px 'Avenir Next', 'Hiragino Sans', sans-serif";
        maxWidth = Math.max(maxWidth, ctx.measureText(station.name).width);
        ctx.font = "11px 'Avenir Next', 'Hiragino Sans', sans-serif";
        maxWidth = Math.max(maxWidth, ctx.measureText(`${station.km.toFixed(1)} km`).width);
      }
      return Math.ceil(maxWidth) + 22;
    }

    function applySidebarWidth(width) {
      sidebarWidth = width;
      document.documentElement.style.setProperty("--sidebar-w", `${width}px`);
    }

    function resizeCanvas(canvas, width, height) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(width * dpr));
      canvas.height = Math.max(1, Math.floor(height * dpr));
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function resizeAll() {
      resizeCanvas(diagramCanvas, diagramArea.clientWidth, diagramArea.clientHeight);
      resizeCanvas(timeCanvas, timeHeader.clientWidth, HEADER_H);
      resizeCanvas(stationCanvas, sidebarWidth, stationSidebar.clientHeight);
    }

    function xOfMinute(minute) {
      return (minute - DISPLAY_START_MIN) * PX_PER_MIN * view.scale + view.offsetX;
    }

    function yOfKm(km) {
      return km * PX_PER_KM * view.scale + view.offsetY;
    }

    function contentWidth() {
      return (DISPLAY_END_MIN - DISPLAY_START_MIN) * PX_PER_MIN * view.scale;
    }

    function contentHeight() {
      return currentLine && currentLine.stations.length
        ? currentLine.stations.at(-1).km * PX_PER_KM * view.scale
        : 0;
    }

    function clampView() {
      const padding = 34;
      const width = contentWidth();
      const height = contentHeight();

      if (width + padding * 2 <= diagramCanvas.clientWidth) {
        view.offsetX = (diagramCanvas.clientWidth - width) / 2;
      } else {
        const minX = diagramCanvas.clientWidth - width - padding;
        view.offsetX = Math.min(padding, Math.max(minX, view.offsetX));
      }

      if (height + padding * 2 <= diagramCanvas.clientHeight) {
        view.offsetY = (diagramCanvas.clientHeight - height) / 2;
      } else {
        const minY = diagramCanvas.clientHeight - height - padding;
        view.offsetY = Math.min(padding, Math.max(minY, view.offsetY));
      }
    }

    function resetView() {
      view.scale = 1;
      view.offsetX = 24;
      view.offsetY = 24;
      clampView();
      drawAll();
    }

    function zoom(factor, cx, cy) {
      const newScale = Math.max(view.minScale, Math.min(view.maxScale, view.scale * factor));
      if (newScale === view.scale) return;
      const centerX = cx == null ? diagramArea.clientWidth / 2 : cx;
      const centerY = cy == null ? diagramArea.clientHeight / 2 : cy;
      const ratio = newScale / view.scale;
      view.offsetX = centerX - (centerX - view.offsetX) * ratio;
      view.offsetY = centerY - (centerY - view.offsetY) * ratio;
      view.scale = newScale;
      clampView();
      drawAll();
    }

    function drawTimeHeader() {
      const width = timeCanvas.clientWidth;
      timeCtx.clearRect(0, 0, width, HEADER_H);
      timeCtx.fillStyle = "rgba(7, 17, 33, 0.95)";
      timeCtx.fillRect(0, 0, width, HEADER_H);

      for (let minute = DISPLAY_START_MIN; minute <= DISPLAY_END_MIN; minute += 2) {
        const x = xOfMinute(minute);
        if (x < -60 || x > width + 60) continue;
        const minuteOfHour = minute % 60;

        if (minuteOfHour === 0) {
          timeCtx.fillStyle = "rgba(236, 240, 241, 0.96)";
          timeCtx.font = "800 22px 'Avenir Next', 'Hiragino Sans', sans-serif";
          timeCtx.textAlign = "center";
          timeCtx.textBaseline = "middle";
          timeCtx.fillText(String(Math.floor(minute / 60)), x, 22);
        } else if (minuteOfHour % 10 === 0) {
          timeCtx.fillStyle = "rgba(159, 184, 214, 0.9)";
          timeCtx.font = "11px 'Avenir Next', 'Hiragino Sans', sans-serif";
          timeCtx.textAlign = "center";
          timeCtx.textBaseline = "middle";
          timeCtx.fillText(String(minuteOfHour), x, 38);
        }
      }

      timeCtx.strokeStyle = "rgba(117, 144, 184, 0.25)";
      timeCtx.lineWidth = 1;
      timeCtx.beginPath();
      timeCtx.moveTo(0, HEADER_H - 0.5);
      timeCtx.lineTo(width, HEADER_H - 0.5);
      timeCtx.stroke();
    }

    function drawStationSidebar() {
      const width = stationCanvas.clientWidth;
      const height = stationCanvas.clientHeight;
      stationCtx.clearRect(0, 0, width, height);
      stationCtx.fillStyle = "rgba(7, 17, 33, 0.95)";
      stationCtx.fillRect(0, 0, width, height);
      if (!currentLine) return;

      const stationFont = Math.max(10, Math.min(14, 14 / Math.sqrt(Math.max(view.scale, 0.8))));
      const kmFont = Math.max(8, Math.min(11, 11 / Math.sqrt(Math.max(view.scale, 0.8))));

      for (const station of currentLine.stations) {
        const y = yOfKm(station.km);
        if (y < -28 || y > height + 28) continue;

        stationCtx.fillStyle = "#ecf0f1";
        stationCtx.font = `700 ${stationFont}px 'Avenir Next', 'Hiragino Sans', sans-serif`;
        stationCtx.textAlign = "right";
        stationCtx.textBaseline = "middle";
        stationCtx.fillText(station.name, width - 8, y - 5);

        if (view.scale >= 0.6) {
          stationCtx.fillStyle = "#7ec8e3";
          stationCtx.font = `${kmFont}px 'Avenir Next', 'Hiragino Sans', sans-serif`;
          stationCtx.fillText(`${station.km.toFixed(1)} km`, width - 8, y + 10);
        }
      }

      stationCtx.strokeStyle = "rgba(117, 144, 184, 0.25)";
      stationCtx.lineWidth = 1;
      stationCtx.beginPath();
      stationCtx.moveTo(width - 0.5, 0);
      stationCtx.lineTo(width - 0.5, height);
      stationCtx.stroke();
    }

    function drawDiagram() {
      const width = diagramCanvas.clientWidth;
      const height = diagramCanvas.clientHeight;
      diagramCtx.clearRect(0, 0, width, height);
      diagramCtx.fillStyle = "#0a1424";
      diagramCtx.fillRect(0, 0, width, height);
      if (!currentLine) return;

      for (let minute = DISPLAY_START_MIN; minute <= DISPLAY_END_MIN; minute += 2) {
        const x = xOfMinute(minute);
        if (x < 0 || x > width) continue;
        const minuteOfHour = minute % 60;
        diagramCtx.beginPath();
        diagramCtx.moveTo(x, 0);
        diagramCtx.lineTo(x, height);

        if (minuteOfHour === 0) {
          diagramCtx.strokeStyle = "rgba(236, 240, 241, 0.45)";
          diagramCtx.lineWidth = 1.5;
          diagramCtx.setLineDash([]);
        } else if (minuteOfHour % 10 === 0) {
          diagramCtx.strokeStyle = "rgba(160, 190, 230, 0.45)";
          diagramCtx.lineWidth = 0.8;
          diagramCtx.setLineDash([]);
        } else {
          diagramCtx.strokeStyle = "rgba(140, 170, 210, 0.32)";
          diagramCtx.lineWidth = 0.7;
          diagramCtx.setLineDash([2, 3]);
        }
        diagramCtx.stroke();
      }
      diagramCtx.setLineDash([]);

      for (const [i, station] of currentLine.stations.entries()) {
        const y = yOfKm(station.km);
        if (y < 0 || y > height) continue;
        if (nozomiStationSet.has(i)) {
          diagramCtx.strokeStyle = "rgba(220, 235, 255, 0.42)";
          diagramCtx.lineWidth = 1.2;
        } else {
          diagramCtx.strokeStyle = "rgba(180, 200, 225, 0.18)";
          diagramCtx.lineWidth = 0.7;
        }
        diagramCtx.beginPath();
        diagramCtx.moveTo(0, y);
        diagramCtx.lineTo(width, y);
        diagramCtx.stroke();
      }

      const lineWidth = Math.max(0.8, Math.min(2, 1.4 / Math.sqrt(view.scale)));
      const shouldLabel = view.scale >= 0.4;

      for (const train of currentLine.trains) {
        const stops = train.stops.filter((stop) => currentLine.stations[stop.si]);
        if (stops.length < 2) continue;

        diagramCtx.strokeStyle = trainColor(train);
        diagramCtx.lineWidth = lineWidth;
        diagramCtx.beginPath();

        let started = false;
        for (const stop of stops) {
          const station = currentLine.stations[stop.si];
          const y = yOfKm(station.km);
          const arr = stop.arr || stop.dep;
          const dep = stop.dep || stop.arr;
          if (!arr || !dep) continue;

          const xArr = xOfMinute(timeToMinutes(arr));
          const xDep = xOfMinute(timeToMinutes(dep));
          if (!started) {
            diagramCtx.moveTo(xArr, y);
            started = true;
          } else {
            diagramCtx.lineTo(xArr, y);
          }
          if (xDep > xArr) diagramCtx.lineTo(xDep, y);
        }
        diagramCtx.stroke();

        if (!shouldLabel) continue;

        let segment = null;
        for (let i = 0; i < stops.length - 1; i++) {
          const from = stops[i];
          const to = stops[i + 1];
          const fromTime = from.dep || from.arr;
          const toTime = to.arr || to.dep;
          if (!fromTime || !toTime) continue;
          const x0 = xOfMinute(timeToMinutes(fromTime));
          const y0 = yOfKm(currentLine.stations[from.si].km);
          const x1 = xOfMinute(timeToMinutes(toTime));
          const y1 = yOfKm(currentLine.stations[to.si].km);
          if (Math.hypot(x1 - x0, y1 - y0) < 24) continue;
          segment = { x0, y0, x1, y1 };
          break;
        }
        if (!segment) continue;

        const angle = Math.atan2(segment.y1 - segment.y0, segment.x1 - segment.x0);
        const text = `${train.trainLabel}${train.trainNo}`;
        const size = Math.max(7, Math.min(11, 9 / Math.sqrt(Math.max(view.scale, 0.65))));
        const px = segment.x0 + Math.cos(angle) * 10;
        const py = segment.y0 + Math.sin(angle) * 10;

        diagramCtx.save();
        diagramCtx.translate(px, py);
        diagramCtx.rotate(angle);
        diagramCtx.fillStyle = trainColor(train);
        diagramCtx.font = `700 ${size}px 'Avenir Next', 'Hiragino Sans', sans-serif`;
        diagramCtx.textAlign = "left";
        diagramCtx.textBaseline = "bottom";
        diagramCtx.shadowColor = "rgba(0, 0, 0, 0.55)";
        diagramCtx.shadowBlur = 6;
        diagramCtx.fillText(text, 0, -2);
        diagramCtx.restore();
      }
    }

    function drawAll() {
      drawDiagram();
      drawTimeHeader();
      drawStationSidebar();
    }

    function renderLegend() {
      legendRowsEl.innerHTML = "";
      for (const key of ["nozomi", "hikari", "kodama", "mizuho", "sakura"]) {
        const meta = TRAIN_META[key];
        const row = document.createElement("div");
        row.className = "legend-row";
        row.innerHTML = `<span class="legend-sample" style="background:${meta.color}"></span><span>${meta.label}</span>`;
        legendRowsEl.appendChild(row);
      }
    }

    function updateMeta() {
      fetchedAtEl.textContent = `取得時刻: ${diagramData.fetchedAt || "-"}`;
      sourceNoteEl.textContent = `データソース: ${diagramData.source || "-"}`;
    }

    function loadLine(key) {
      if (!diagramData || !diagramData.lines || !diagramData.lines[key]) return;
      currentLine = diagramData.lines[key];
      lineNameDisplay.textContent = currentLine.lineName;
      lineNameDisplay.textContent = currentLine.lineName;
      nozomiStationSet = new Set();
      for (const train of currentLine.trains) {
        if (train.kind === "nozomi") {
          for (const stop of train.stops) nozomiStationSet.add(stop.si);
        }
      }
      applySidebarWidth(calcSidebarWidth(currentLine.stations));
      resizeAll();
      resetView();
    }

    let mouseDragging = false;
    let lastX = 0;
    let lastY = 0;

    diagramArea.addEventListener("mousedown", (event) => {
      mouseDragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
    });

    window.addEventListener("mousemove", (event) => {
      if (!mouseDragging) return;
      view.offsetX += event.clientX - lastX;
      view.offsetY += event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;
      clampView();
      drawAll();
    });

    window.addEventListener("mouseup", () => {
      mouseDragging = false;
    });

    diagramArea.addEventListener("wheel", (event) => {
      event.preventDefault();
      const rect = diagramArea.getBoundingClientRect();
      zoom(event.deltaY < 0 ? 1.12 : 0.9, event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });

    let touchMode = [];
    let pinchDistance = 0;
    let pinchMidpoint = null;

    function touchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function touchMidpoint(touches) {
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }

    diagramArea.addEventListener("touchstart", (event) => {
      event.preventDefault();
      touchMode = Array.from(event.touches);
      if (touchMode.length === 2) {
        pinchDistance = touchDistance(touchMode);
        pinchMidpoint = touchMidpoint(touchMode);
      } else if (touchMode.length === 1) {
        lastX = touchMode[0].clientX;
        lastY = touchMode[0].clientY;
      }
    }, { passive: false });

    diagramArea.addEventListener("touchmove", (event) => {
      event.preventDefault();
      const touches = Array.from(event.touches);
      const rect = diagramArea.getBoundingClientRect();

      if (touches.length === 2 && touchMode.length === 2) {
        const nextDistance = touchDistance(touches);
        const nextMidpoint = touchMidpoint(touches);
        if (pinchDistance > 0) {
          zoom(nextDistance / pinchDistance, nextMidpoint.x - rect.left, nextMidpoint.y - rect.top);
        }
        view.offsetX += nextMidpoint.x - pinchMidpoint.x;
        view.offsetY += nextMidpoint.y - pinchMidpoint.y;
        pinchDistance = nextDistance;
        pinchMidpoint = nextMidpoint;
      } else if (touches.length === 1) {
        view.offsetX += touches[0].clientX - lastX;
        view.offsetY += touches[0].clientY - lastY;
        lastX = touches[0].clientX;
        lastY = touches[0].clientY;
      }

      touchMode = touches;
      clampView();
      drawAll();
    }, { passive: false });

    diagramArea.addEventListener("touchend", (event) => {
      touchMode = Array.from(event.touches);
      if (touchMode.length < 2) {
        pinchDistance = 0;
        pinchMidpoint = null;
      }
    });


    window.addEventListener("resize", () => {
      if (!currentLine) return;
      resizeAll();
      clampView();
      drawAll();
    });

    async function initialize() {
      renderLegend();
      try {
        if (window.DIAGRAM_DATA && window.DIAGRAM_DATA.lines) {
          currentSource = "local";
          diagramData = window.DIAGRAM_DATA;
          setLoading(`ローカルデータを読み込みました\n${Object.keys(diagramData.lines).length}ビュー / ${Object.values(diagramData.lines).reduce((sum, line) => sum + line.trains.length, 0)}列車`);
        } else {
          throw new Error("diagram-data.js がありません。サーバー負荷を避けるため、ブラウザからの全件取得は行いません。先に `bun fetch-diagram.ts` を実行してください。");
        }

        updateMeta();

        const defaultKey = "tokyo_hakata";
        loadLine(defaultKey);
        loadingEl.classList.add("hidden");
      } catch (error) {
        console.error(error);
        setLoading(
          "データを読み込めませんでした。\n\n" +
          "1. 先に bun fetch-diagram.ts を実行して diagram-data.js を生成する\n" +
          "2. その後に index.html を開く\n\n" +
          `詳細: ${error.message || error}`
        );
      }
    }

    initialize();
  </script>
</body>
</html>
